<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HiddenShield Workbench</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#242b2a",
                        "on-tertiary-container": "#744000",
                        "tertiary": "#ffd1aa",
                        "on-secondary-fixed": "#2a1700",
                        "on-background": "#dde4e1",
                        "inverse-surface": "#dde4e1",
                        "secondary-container": "#ee9800",
                        "primary-fixed-dim": "#3cddc7",
                        "primary": "#57f1db",
                        "surface-container-highest": "#2f3634",
                        "on-tertiary-fixed": "#2d1600",
                        "on-surface": "#dde4e1",
                        "on-secondary-container": "#5b3800",
                        "on-tertiary": "#4b2800",
                        "surface-variant": "#2f3634",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2b3230",
                        "on-primary-fixed": "#00201c",
                        "on-secondary": "#472a00",
                        "surface-container": "#1a211f",
                        "secondary": "#ffb95f",
                        "on-primary-container": "#00574d",
                        "surface-tint": "#3cddc7",
                        "on-tertiary-fixed-variant": "#6b3b00",
                        "tertiary-container": "#ffac5a",
                        "on-primary": "#003731",
                        "error": "#ffb4ab",
                        "primary-container": "#2dd4bf",
                        "inverse-primary": "#006b5f",
                        "outline": "#859490",
                        "surface-container-low": "#161d1b",
                        "secondary-fixed": "#ffddb8",
                        "on-primary-fixed-variant": "#005047",
                        "background": "#0e1513",
                        "surface-bright": "#333b39",
                        "surface-dim": "#0e1513",
                        "primary-fixed": "#62fae3",
                        "tertiary-fixed-dim": "#ffb875",
                        "error-container": "#93000a",
                        "on-surface-variant": "#bacac5",
                        "outline-variant": "#3c4a46",
                        "on-error": "#690005",
                        "surface-container-lowest": "#09100e",
                        "surface": "#0e1513",
                        "tertiary-fixed": "#ffdcc0",
                        "on-secondary-fixed-variant": "#653e00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "padding-xs": "4px",
                        "container-margin": "24px",
                        "padding-md": "16px",
                        "padding-lg": "24px",
                        "unit": "4px",
                        "padding-sm": "8px",
                        "safe": "env(safe-area-inset-bottom, 16px)"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-sm": ["11px", { "lineHeight": "12px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-container-margin py-padding-sm z-10 shrink-0">
<div class="flex items-center gap-4">
<button class="text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full">
<span class="material-symbols-outlined">search</span>
</button>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary">
            HiddenShield
        </div>
<div class="flex items-center gap-2">
<button class="text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full">
<span class="material-symbols-outlined">sync</span>
</button>
<button class="text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full">
<span class="material-symbols-outlined">workspace_premium</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto px-padding-lg pt-padding-lg pb-[100px] flex flex-col gap-6">
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container rounded-xl py-4 px-6 flex items-center justify-center gap-2 hover:opacity-90 transition-opacity font-label-lg text-label-lg shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
            New Task
        </button>
<!-- System Health Card -->
<section class="flex flex-col gap-3">
<h2 class="font-headline-sm text-headline-sm text-on-surface">System Health</h2>
<div class="bg-surface-container border border-outline-variant rounded-xl p-4 flex gap-4">
<div class="flex-1 bg-surface-container-low rounded-lg p-3 flex flex-col gap-1 items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary mb-1">cloud_sync</span>
<span class="font-label-md text-label-md text-on-surface-variant">Sync Status</span>
<span class="font-body-md text-body-md text-primary font-medium">Optimal</span>
</div>
<div class="flex-1 bg-surface-container-low rounded-lg p-3 flex flex-col gap-1 items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-secondary mb-1">notifications_active</span>
<span class="font-label-md text-label-md text-on-surface-variant">Active Alerts</span>
<span class="font-body-md text-body-md text-secondary font-medium">2 Warnings</span>
</div>
</div>
</section>
<!-- Recent Activity Cards -->
<section class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Recent Activity</h2>
<button class="font-label-md text-label-md text-primary hover:underline">View All</button>
</div>
<div class="flex flex-col gap-3">
<!-- Task 1: Ready -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col gap-3 hover:bg-surface-container-high transition-colors">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Process Data Batch #892</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-1">Started 10 mins ago</span>
</div>
<div class="px-2 py-1 bg-primary/10 border border-primary text-primary font-label-sm text-label-sm rounded flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-primary"></div>
                            Ready
                        </div>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-1 mt-2">
<div class="bg-primary h-1 rounded-full" style="width: 100%"></div>
</div>
</div>
<!-- Task 2: Warning -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col gap-3 hover:bg-surface-container-high transition-colors">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Verify Access Logs</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-1">Stage 2 of 4: Scanning...</span>
</div>
<div class="px-2 py-1 bg-secondary/10 border border-secondary text-secondary font-label-sm text-label-sm rounded flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">warning</span>
                            Locked
                        </div>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-1 mt-2">
<div class="bg-secondary h-1 rounded-full" style="width: 45%"></div>
</div>
</div>
<!-- Task 3: Failed -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col gap-3 hover:bg-surface-container-high transition-colors">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Vault Metadata Backup</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-1">Attempted 1 hour ago</span>
</div>
<div class="px-2 py-1 bg-error/10 border border-error text-error font-label-sm text-label-sm rounded flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">error</span>
                            Failed
                        </div>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 border-t border-outline-variant bg-surface-container-highest lg:hidden shadow-lg left-0 flex justify-around items-center px-padding-md pb-safe pt-2">
<!-- Workbench (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:bg-surface-variant scale-95 duration-75">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-sm text-label-sm mt-1">Workbench</span>
</button>
<!-- Process (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-1 active:bg-surface-variant scale-95 duration-75 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">settings_suggest</span>
<span class="font-label-sm text-label-sm mt-1">Process</span>
</button>
<!-- Verify (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-1 active:bg-surface-variant scale-95 duration-75 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">verified_user</span>
<span class="font-label-sm text-label-sm mt-1">Verify</span>
</button>
<!-- Vault (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-1 active:bg-surface-variant scale-95 duration-75 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">enhanced_encryption</span>
<span class="font-label-sm text-label-sm mt-1">Vault</span>
</button>
<!-- Queue (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-1 active:bg-surface-variant scale-95 duration-75 hover:text-on-surface transition-colors hidden sm:flex">
<span class="material-symbols-outlined">view_list</span>
<span class="font-label-sm text-label-sm mt-1">Queue</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-1 active:bg-surface-variant scale-95 duration-75 hover:text-on-surface transition-colors hidden sm:flex">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</nav>
</body></html>
