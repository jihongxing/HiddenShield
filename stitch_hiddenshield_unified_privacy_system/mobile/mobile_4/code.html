<style>
        body { background-color: #0F172A; } /* Enforcing Level 0 background from guidance */

<body class="bg-background dark:bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:max-w-md md:mx-auto md:border-x md:border-outline-variant relative pb-20">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background text-primary dark:text-primary font-headline-md text-headline-md w-full top-0 border-b border-outline-variant dark:border-outline-variant transition-colors duration-200 flex justify-between items-center px-container-margin py-padding-md z-40 sticky top-0 shadow-sm shadow-[#0F172A]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined hover:bg-surface-container dark:hover:bg-surface-container rounded-full p-1 cursor-pointer transition-colors" data-icon="security" data-weight="fill" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">安全哨兵</span>
</div>
<div>
<span class="material-symbols-outlined hover:bg-surface-container dark:hover:bg-surface-container rounded-full p-1 cursor-pointer transition-colors text-on-surface-variant dark:text-on-surface-variant" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-margin py-padding-lg flex flex-col gap-padding-lg overflow-y-auto">
<!-- Guided Progress Header -->
<section class="flex flex-col gap-padding-xs">
<div class="flex justify-between items-end mb-1">
<h1 class="font-headline-lg text-headline-lg text-on-background">资产处理</h1>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Step 1 of 3</span>
</div>
<!-- Minimal Progress Bar -->
<div class="w-full bg-surface-container h-unit rounded-full overflow-hidden">
<div class="bg-primary-container h-full rounded-full transition-all duration-500 w-1/3"></div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">选择媒体: 请上传需要处理的数字资产文件以进行水印和确权验证。</p>
</section>
<!-- Upload Drop Zone (Card Level 1 Surface) -->
<section class="flex-1 flex flex-col justify-center">
<div class="card-surface rounded-xl border-2 border-dashed flex flex-col items-center justify-center p-8 transition-colors duration-200 hover:bg-[#2D3748] cursor-pointer min-h-[300px] relative group" id="drop-zone">
<input aria-label="Upload media file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" id="file-upload" type="file"/>
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-on-primary-container transition-colors duration-300" data-icon="cloud_upload">cloud_upload</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-background mb-2">点击或拖拽上传</h3>
<p class="font-body-sm text-body-sm text-outline text-center mb-6 max-w-[80%]">支持的格式: PNG, JPG, MP4, PDF. 最大文件大小: 50MB.</p>
<!-- Security Assurance Chip -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-sm bg-[#161d1b]/50 border-l-2 border-primary-container mt-auto">
<span class="material-symbols-outlined text-[14px] text-primary" data-icon="encrypted">encrypted</span>
<span class="font-label-sm text-label-sm text-primary">端到端加密传输</span>
</div>
</div>
</section>
<!-- Action Area -->
<section class="mt-auto pt-4 flex flex-col gap-4">
<button class="w-full bg-primary-container text-background font-label-lg text-label-lg py-3 rounded-lg hover:bg-primary transition-colors flex justify-center items-center gap-2 opacity-50 cursor-not-allowed" disabled="" id="next-btn">
<span>下一步: 水印设置</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-padding-sm bg-surface-container-high dark:bg-surface-container-high border-t border-outline-variant dark:border-outline-variant font-label-sm text-label-sm z-50 md:hidden pb-safe">
<!-- Dashboard -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary transition-transform duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span>工作台</span>
</a>
<!-- Processing (Active Semantic Match for "Process / Write") -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-full px-4 py-1 hover:text-primary dark:hover:text-primary transition-transform duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="pending_actions" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pending_actions</span>
<span>处理</span>
</a>
<!-- Verification -->

<span class="material-symbols-outlined mb-1" data-icon="verified_user">verified_user</span>
<span>验证</span>
</a>
<!-- Archive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary transition-transform duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="folder_open">folder_open</span>
<span>档案</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary transition-transform duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span>设置</span>
</a>

<!-- Safe Area padding for mobile browsers -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
<script>
        // Simple interaction script to simulate file selection
        const fileInput = document.getElementById('file-upload');
        const nextBtn = document.getElementById('next-btn');
        const dropZone = document.getElementById('drop-zone');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                nextBtn.removeAttribute('disabled');
                dropZone.classList.add('border-primary-container');
                dropZone.classList.remove('border-dashed');
                dropZone.classList.add('border-solid');
            } else {
                nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                nextBtn.setAttribute('disabled', 'true');
                dropZone.classList.remove('border-primary-container', 'border-solid');
                dropZone.classList.add('border-dashed');
            }
        });
    </script>
</body></html>
